<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register — PragyaSetu</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="ss-auth-page">
    <div class="ss-auth-card">
      <div class="ss-auth-brand">PragyaSetu</div>
      <div class="ss-auth-sub">Capacity building layer for iGOT Karmayogi</div>

      <h1 class="ss-auth-title">Create an account</h1>

      {% if error %}
        <div class="ss-auth-error">{{ error }}</div>
      {% endif %}

      <form method="post" class="ss-auth-form">
        <label class="ss-auth-label">Username
          <input class="ss-auth-input" type="text" name="username" required autofocus />
        </label>
        <label class="ss-auth-label">Password
          <input class="ss-auth-input" type="password" name="password" required minlength="6" />
        </label>
        <div class="ss-auth-hint">At least 6 characters.</div>
        <button class="ss-btn ss-btn-primary ss-auth-submit" type="submit">Register</button>
      </form>

      <div class="ss-auth-switch">
        Already have an account? <a href="{{ url_for('login') }}">Log in</a>
      </div>
    </div>
  </div>
</body>
</html>
